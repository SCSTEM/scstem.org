[settings]
lockfile = true
minimum_release_age = "7d"
npm.package_manager = "pnpm"

[tools]
node = "26.13.0"
pnpm = "12.17.0"
hk = "2.11.0"
actionlint = "1.7.12"

"npm:agent-browser" = "0.41.1"

# Installs the pre-commit hook; CI does not commit.
[hooks]
postinstall = '[ -n "$CI" ] || mise x -- hk install --mise'

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
ASTRO_TELEMETRY_DISABLED = "1"

[tasks.dev]
description = "Run the development server"
run = "pn run dev"

[tasks."install:browser"]
description = "Install Chrome for agent-browser"
run = """
if [ "$(uname -s)" = Linux ]; then agent-browser install --with-deps; else agent-browser install; fi
"""
