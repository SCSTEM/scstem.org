name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Every step runs even after an earlier one fails, so one PR run reports every kind of
      # problem. The ESLint matcher turns findings into inline annotations on the PR diff.
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: |
          echo "::add-matcher::.github/eslint-matcher.json"
          pnpm lint
      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm fmt:check
      - name: Unused code and dependencies
        if: ${{ !cancelled() }}
        run: pnpm knip
      - name: Content references
        if: ${{ !cancelled() }}
        run: pnpm check:content

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # Title and description uniqueness, and whether every og:image resolves, are only
      # answerable across the whole built site.
      - name: Page metadata
        run: pnpm check:meta

      # --root-dir resolves the root-relative hrefs Astro emits. llms.txt is in scope because its
      # links are hand-written paths that nothing else checks against the routes they name.
      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html' 'dist/llms.txt'
          fail: true

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 1

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      # lhci is a CI-only tool run through dlx rather than a devDependency: it pulls Lighthouse
      # and Puppeteer, which nobody needs to develop a page (docs/adr/0007-lighthouse-ci-gate.md).
      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      - name: Summarize
        if: ${{ !cancelled() }}
        run: node tools/ci/lighthouse-summary.ts >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
