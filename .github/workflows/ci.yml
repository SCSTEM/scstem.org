name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.14
          install: true
          cache: true

      # mise-action's cache covers mise-managed tool binaries (node, pnpm), not
      # pnpm's content-addressable store, so without this every run re-downloads
      # the whole tree.
      - name: Locate pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >>"$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check (typecheck + lint + format + knip)
        run: pnpm check

      - name: Build
        run: pnpm build

      # The app shell links to routes Phase 07 has not built yet, so `.lycheeignore` excludes
      # exactly those. This fails if one of them has since been built, so the exclusions cannot
      # outlive their purpose and start hiding a real 404.
      - name: Check for stale link exclusions
        run: node tools/checks/stale-link-ignores.mjs

      # --root-dir is required for the root-relative hrefs Astro emits (/_astro/...);
      # without it lychee cannot resolve them in local files and errors on every page.
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true
