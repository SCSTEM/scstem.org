name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check
        run: |
          echo "::add-matcher::.github/typescript-matchers.json"
          pnpm check

  build:
    name: Build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      LHCI_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        id: build
        run: pnpm build

      - name: Page metadata
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm check:meta

      # Future dates live only in an isolated fixture build, even when every production event has
      # retired.
      - name: Event fixtures
        id: events
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm check:events

      # `--root-dir` resolves the root-relative hrefs Astro emits, and `--fallback-extensions` maps a
      # page path to its `.html` file; `llms.txt` has hand-written paths that nothing else checks
      # against routes.
      - name: Links
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            --root-dir ${{ github.workspace }}/dist --fallback-extensions html
            'dist/**/*.html' 'dist/llms.txt'
          fail: true

      # The build is deterministic, so an identical `dist/` measured with the same server, config,
      # and lhci version has already passed; only the marker file is cached.
      - name: Look up a previous Lighthouse pass
        id: lighthouse-pass
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.events.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: .lighthouseci/passed
          key: lighthouse-${{ env.LHCI_VERSION }}-${{ hashFiles('dist/**', '.lighthouseci/events/**', 'tools/ci/**') }}
          lookup-only: true

      - name: Lighthouse CI
        id: lighthouse
        if: ${{ !cancelled() && steps.lighthouse-pass.outcome == 'success' && steps.lighthouse-pass.outputs.cache-hit != 'true' }}
        run: |
          pnpm dlx @lhci/cli@${{ env.LHCI_VERSION }} autorun --config=tools/ci/lighthouserc.json
          touch .lighthouseci/passed

      # Also written to the log so the waterfall behind a failed LCP assertion is readable without
      # downloading the report artifact.
      - name: Summarize Lighthouse
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        run: node tools/ci/lighthouse-summary.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Note the skipped Lighthouse run
        if: ${{ steps.lighthouse-pass.outputs.cache-hit == 'true' }}
        run: echo "Lighthouse skipped, this exact build already passed." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/

      - uses: actions/cache/save@v6
        if: ${{ steps.lighthouse.outcome == 'success' }}
        with:
          path: .lighthouseci/passed
          key: ${{ steps.lighthouse-pass.outputs.cache-primary-key }}
