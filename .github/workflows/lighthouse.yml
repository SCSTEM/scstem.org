name: Lighthouse

# On pull requests only with the `lighthouse` label, and not a required check there.
on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    if: >-
      ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'lighthouse')) }}
    runs-on: ubuntu-latest
    env:
      LHCI_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm build
      - run: pnpm check:events

      - name: Identify audit browser
        id: browser
        run: |
          chrome_path="$(command -v google-chrome)"
          echo "CHROME_PATH=$chrome_path" >>"$GITHUB_ENV"
          echo "version=$("$chrome_path" --version | sha256sum | cut -d ' ' -f1)" >>"$GITHUB_OUTPUT"

      # The build is deterministic, so an identical `dist/` measured with the same server, config,
      # and lhci version has already passed; only the marker file is cached.
      - name: Look up a previous Lighthouse pass
        id: lighthouse-pass
        uses: actions/cache/restore@v6
        with:
          path: .lighthouseci/passed
          key: lighthouse-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser.outputs.version }}-${{ env.LHCI_VERSION }}-${{ hashFiles('dist/**', '.lighthouseci/events/**', 'tools/ci/**', '.github/workflows/lighthouse.yml') }}
          lookup-only: true

      - name: Lighthouse CI
        id: lighthouse
        if: ${{ steps.lighthouse-pass.outputs.cache-hit != 'true' }}
        run: |
          pnpm dlx @lhci/cli@${{ env.LHCI_VERSION }} autorun --config=tools/ci/lighthouserc.json
          touch .lighthouseci/passed

      # Also written to the log so the waterfall behind a failed LCP assertion is readable without
      # downloading the report artifact.
      - name: Summarize Lighthouse
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        run: node tools/ci/lighthouse-summary.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Note the skipped Lighthouse run
        if: ${{ steps.lighthouse-pass.outputs.cache-hit == 'true' }}
        run: echo "Lighthouse skipped, this exact build already passed." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/

      - uses: actions/cache/save@v6
        if: ${{ steps.lighthouse.outcome == 'success' }}
        with:
          path: .lighthouseci/passed
          key: ${{ steps.lighthouse-pass.outputs.cache-primary-key }}
