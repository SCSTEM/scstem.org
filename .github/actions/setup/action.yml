name: Setup
description: Install the mise-pinned toolchain and the pnpm dependencies, with both cached.
runs:
  using: composite
  steps:
    # The downloads, not the installed tools: mise checks every cached download against the
    # checksum in `mise.lock`, and trusts a restored install as is.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/mise/downloads-cas
        key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

    # Only the tools the jobs run; local-only tools such as agent-browser are skipped.
    - uses: jdx/mise-action@v5
      with:
        version: 2026.10.25
        install_args: node pnpm hk actionlint
        cache: false

    - name: Locate pnpm store
      shell: bash
      run: echo "PNPM_STORE=$(pnpm store path --silent)" >>"$GITHUB_ENV"

    - uses: actions/cache@v6
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
