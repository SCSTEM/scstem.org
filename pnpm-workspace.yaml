# Install policy only — this repo is a single package, so there is no `packages:` key.

# Supply-chain cooldown: refuse versions published less than a week ago.
minimumReleaseAge: 10080 # minutes (7 days)

# Only these packages may run install scripts.
allowBuilds:
  sharp: true # astro:assets image processing
  esbuild: true

# eslint-plugin-jsx-a11y 6.10.2 is its latest release and its peer range stops at
# eslint ^9, but the rules load and fire under eslint 10 (a seeded alt-text and
# click-events violation is reported). Without this the unmet peer is a warning
# on every install.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"
