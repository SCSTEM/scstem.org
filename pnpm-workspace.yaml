minimumReleaseAge: 10080 # 7 days, in minutes

allowBuilds:
  sharp: true
  esbuild: true
  # Its postinstall only runs IBM's telemetry collector; the SVGs ship in the tarball.
  "@carbon/icons": false

# eslint-plugin-jsx-a11y's peer range stops at eslint ^9, but its rules load and fire under
# eslint 10; without this the unmet peer is a warning on every install.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"
